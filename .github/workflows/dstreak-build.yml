name: DStreak Android Build

on:
  push:
    branches: [main]
    paths:
      - 'DStreak-source.zip.part*'
      - '.github/workflows/dstreak-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout DStreak source parts
        uses: actions/checkout@v4

      - name: Verify and combine DStreak ZIP parts
        shell: bash
        run: |
          set -euo pipefail
          for part in 01 02 03 04 05; do
            test -s "DStreak-source.zip.part${part}" || { echo "Missing DStreak part ${part}"; exit 1; }
          done
          cat DStreak-source.zip.part01 DStreak-source.zip.part02 DStreak-source.zip.part03 DStreak-source.zip.part04 DStreak-source.zip.part05 > DStreak-source.zip
          unzip -t DStreak-source.zip
          mkdir source
          unzip -q DStreak-source.zip -d source
          PROJECT_DIR="$(find source -type f -name pubspec.yaml -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "No Flutter pubspec.yaml found in the DStreak source."
            find source -maxdepth 4 -type f | head -200
            exit 1
          fi
          echo "FLUTTER_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up compatible Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: ${{ env.FLUTTER_PROJECT_DIR }}
        run: flutter pub get

      - name: Build DStreak debug APK
        working-directory: ${{ env.FLUTTER_PROJECT_DIR }}
        run: flutter build apk --debug

      - name: Collect DStreak APK and source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/output"
          find "$FLUTTER_PROJECT_DIR/build/outputs/flutter-apk" -type f -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/output/" \;
          test -n "$(find output -type f -name '*.apk' -print -quit)"
          cp DStreak-source.zip output/

      - name: Upload DStreak APK and source
        uses: actions/upload-artifact@v4
        with:
          name: DStreak-APK-and-source
          path: output/*
          if-no-files-found: error
          retention-days: 14
